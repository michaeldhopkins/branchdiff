name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A new push replaces a run that has not finished. The allocation bench is
# required, and a superseded commit should not hold a runner until the
# six-hour default.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check, Test, Lint
    runs-on: ubuntu-latest
    # The allocation bench is a required step. 45 minutes covers a cold
    # compile, the tests, clippy, and both benches. The default is six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Alloc pins were measured on the channel in rust-toolchain.toml.
      # @master is this action's branch. The toolchain input is the compiler.
      # @stable would float, and a later stable can move std's allocations.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked --lib --bins

      # The runner image ships Chrome; a missing browser fails this step.
      - name: cargo test (live page in headless Chrome)
        run: cargo test --locked --features browser-tests --test html_live_page

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo bench (allocation pins)
        run: cargo bench --locked --bench alloc

      - name: cargo bench (wall clock, advisory)
        run: cargo bench --locked --bench performance -- --noplot
        continue-on-error: true

      - uses: taiki-e/install-action@cargo-deny

      - name: cargo deny (advisories, bans, licenses)
        run: cargo deny check advisories bans licenses
