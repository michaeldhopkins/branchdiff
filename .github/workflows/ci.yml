name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: Check, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked --lib --bins

      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo bench (allocation pins)
        run: cargo bench --locked --bench alloc

      - name: cargo bench (wall clock, advisory)
        run: cargo bench --locked --bench performance -- --noplot
        continue-on-error: true

      - uses: taiki-e/install-action@cargo-deny

      - name: cargo deny (advisories, bans, licenses)
        run: cargo deny check advisories bans licenses
