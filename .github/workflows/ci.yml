name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Branch and PR pushes replace a run that has not finished; main runs to
# completion so release-branch checks never drop mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  JJ_VERSION: v0.45.1
  JJ_USER: branchdiff-ci
  JJ_EMAIL: ci@example.invalid

jobs:
  ci:
    name: Check, Test, Lint
    runs-on: ubuntu-latest
    # The allocation bench is a required step. 45 minutes covers a cold
    # compile, the tests, clippy, and both benches. The default is six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Alloc pins were measured on the channel in rust-toolchain.toml.
      # @master is this action's branch. The toolchain input is the compiler.
      # @stable would float, and a later stable can move std's allocations.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install jj
        run: |
          set -euo pipefail
          url="https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          # Extract the whole archive and install the one file: the archive
          # stores `./jj`, and whether a bare `jj` member matches differs between
          # GNU tar and bsdtar.
          tmp="$(mktemp -d)"
          curl -fsSL "$url" | tar xz -C "$tmp"
          mkdir -p "$HOME/.local/bin"
          install -m755 "$tmp/jj" "$HOME/.local/bin/jj"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/jj" --version

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked --lib --bins

      - name: cargo test (performance budgets)
        env:
          GITHUB_REF: ${{ github.ref }}
          PERF_BASELINE_REV: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: cargo test --locked --test perf_rules --test ci_alloc_job

      # The runner image ships Chrome; a missing browser fails this step.
      - name: cargo test (live page in headless Chrome)
        run: cargo test --locked --features browser-tests --test html_live_page

      - name: cargo clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: cargo bench (allocation pins)
        run: cargo bench --locked --bench alloc

      - name: cargo bench (wall clock)
        run: cargo bench --locked --bench performance -- --noplot

      # Blocking: compares each bench to its ref_median_ns after dividing out the
      # runner's overall speed (tests/wall_medians.rs), so a runner slower than
      # the reference machine does not fail it but one regressed bench does.
      - name: wall medians against their pins
        env:
          PERF_WALL_CHECK: "1"
        run: cargo test --locked --test wall_medians

      - uses: taiki-e/install-action@cargo-deny

      - name: cargo deny (advisories, bans, licenses)
        run: cargo deny check advisories bans licenses
