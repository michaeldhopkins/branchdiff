# The html group was measured 2026-10-20, on the same channel.
# max_bytes is the aarch64 figure (this Mac, and any arm64 Linux). x86_64 allocates
# slightly more bytes for the same blocks (about 0.05%), so max_bytes_x86_64 pins
# the figure measured on x86_64 Linux, which is what CI runs. Both were reproduced
# in containers of each architecture.
[[bench]]
id = "html/render/50_lines"
max_blocks = 16693
max_bytes = 3718400
max_bytes_x86_64 = 3732740
ref_median_ns = 1197400
ci_median_ns = 1711100

