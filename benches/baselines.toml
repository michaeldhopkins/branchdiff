# Hot-path pins for branchdiff.
# Allocation counts are one call at opt-level 3, measured 2026-10-18 on the
# channel in rust-toolchain.toml. CI installs that channel. A floating stable
# toolchain can move std's allocations, so these pins are for that compiler.
# `cargo bench --bench alloc` fails when a count exceeds max_blocks or max_bytes.
# ref_median_ns is the median point estimate in nanoseconds, rounded, measured
# 2026-10-18 on the reference machine. The printed Criterion "time:" line is the
# slope when outliers pull it away from the median; the pin is the median.
# tests/wall_medians.rs compares measured medians to these pins in CI, relative to the runner speed.
# ci_median_ns, where a bench has one, is the pin CI judges it on (PERF_WALL_PINS=ci): the
# lowest Criterion estimate seen on the CI runners, which are x86_64 and spawn processes slower than this
# Mac. It may only go down, like every pin. ref_median_ns stays the Mac figure the perf.toml
# floors derive from and what a local run is judged on.
# Only four benches have one (CI_PINNED_BENCHES in tests/perf_rules/guard.rs), and each is at most 6x
# its ref_median_ns. Evidence, CI runs 43272055235, 41848995611, 41363441341, 40863237322 and
# 40129949646: html/render/50_lines time in ms 2.34, 3.83, 3.77, 1.71, 3.50 (pin 1.7111);
# html/render/200_lines 10.27, 14.53, 14.36, 7.57, 15.11 (pin 7.5726); html/render/500_lines 22.01,
# 31.04, 31.42, 16.66, 32.72 (pin 16.661). refresh/head/500f_25c was added later and its pin, 6.96 s,
# is its first CI measurement.
# The refresh group has no allocation pin: it shells out to jj.

[[bench]]
id = "frame_context/full/1k_lines"
max_blocks = 1
max_bytes = 24480
ref_median_ns = 254

