# Supply-chain policy, enforced in CI via `cargo deny check`.
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Vulnerabilities hard-fail at any depth (the default). Unmaintained advisories
# only fail for our own direct dependencies — a transitive crate going
# unmaintained is upstream's to replace and shouldn't block our CI.
unmaintained = "workspace"
# A transitive crate being yanked (e.g. core2) is likewise not actionable here.
yanked = "warn"
ignore = [
    # quick-xml DoS advisories, pulled transitively by `syntect -> plist`, which
    # only parses `.tmTheme` XML. branchdiff uses precompiled `two-face` syntaxes
    # and builds themes programmatically (src/syntax/theme.rs) — it never parses
    # attacker-controlled XML, so these code paths are unreachable. Revisit when
    # syntect/plist bump quick-xml to >= 0.41.0.
    { id = "RUSTSEC-2026-0194", reason = "unreachable: no .tmTheme/XML parsing (bundled syntaxes, programmatic themes)" },
    { id = "RUSTSEC-2026-0195", reason = "unreachable: no .tmTheme/XML parsing (bundled syntaxes, programmatic themes)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Zlib",
    "NCSA", # rav1e (AVIF encoding via image)
]

[bans]
# Defaults are fine; this section exists so `cargo deny check bans` has a home.
multiple-versions = "allow"
