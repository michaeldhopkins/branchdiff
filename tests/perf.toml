proposal = "--files --json shares listing::render's full vcs.refresh() (131.5 ms, 61 spawns with 50 per-file jj file show calls) plus a separate vcs.current_revision_id() spawn (10.7 ms with JSON serialization in refresh/files_json/500f_25c), spending over 99% of its time in subprocesses rather than JSON encoding. Route OutputMode::Files through the batched Vcs::file_list numstat/status query and include the @ change ID in the discovery jj log template so neither refresh() nor a second head query runs, reducing spawns from 62 to 5 and wall time from ~142 ms to ~18 ms (~124 ms saved) while reusing the existing FileList JSON serializer."

