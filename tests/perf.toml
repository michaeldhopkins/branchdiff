# Performance budgets. Counts are gated by tests/perf_rules.rs on this machine.
# Wall floors are ceilings of the committed ref_median_ns in benches/baselines.toml
# (2026-10-18, html rows 2026-10-20, command rows 2026-10-24); entries without a
# Criterion bench carry owed = true so placeholder floors are not presented as
# measured. A floor or a target may only tighten.
# Class caps live in the checker: command is 50ms, keystroke 8ms,
# page 100ms, frame 4ms, mcp 200ms.
#
# Command and page fixture: 500 files, 25 changed, 5 lines each. That is the
# scale of refresh/colocated/500f_25c. Keystrokes render 30 files of 300 lines
# (10k lines), the scale of the navigation and frame_context benches.

[[op]]
id = "command:branchdiff"
class = "command"
fixture = "500 files, 25 changed, 5 lines each; scale of refresh/colocated/500f_25c, baselines 2026-10-18"
test = "tests/perf_rules/counts.rs::command_process_counts_match_their_floors"
processes = 63
benches = ["update/handle_tick", "refresh/colocated/500f_25c"]
wall_floor_us = 131542
target_us = 50000
derivation = "Startup loads the same diff as print; one batched jj log plus the first frame fits in the 50 ms command budget. Measured through --benchmark 1 because the interactive loop does not exit."
proposal = "50 of the 63 subprocesses are per-file jj file show spawns in process_jj_file (2 per changed file for base and @-), 11 are serial revision/anchor/status lookups, and 2 are duplicate jj log label queries in build_initial_app before refresh(). Resolve base, parent, fork-point, stack-tip, and labels in one templated jj log via load_comparison_and_refresh and stream the 50 historical blobs from the backing Git store through two git cat-file --batch pipes (matching GitVcs::batch_file_contents), cutting 63 spawns to 6 and wall time from ~132 ms to ~25 ms (~107 ms saved) at the cost of mapping jj revisions to git commit OIDs with a jj file show fallback for non-Git backends."

[[op]]
id = "command:print"
class = "command"
fixture = "500 files, 25 changed, 5 lines each; scale of refresh/colocated/500f_25c, baselines 2026-10-18"
test = "tests/perf_rules/counts.rs::command_process_counts_match_their_floors"
processes = 61
benches = ["refresh/colocated/500f_25c", "refresh/colocated/50f_10c", "refresh/non_colocated/50f_10c"]
wall_floor_us = 131542
target_us = 50000
derivation = "One batched jj diff of the 500-file fixture (40 ms) plus writing the rendered text fits in the 50 ms command budget."
proposal = "61 subprocesses run on 25 changed files (131.5 ms in refresh/colocated/500f_25c): 50 per-file jj file show --ignore-working-copy calls in process_jj_file (base and @- per file) plus 11 serial jj log and git status/diff metadata queries. Replace the 50 per-file jj file show calls with two git cat-file --batch streams keyed by the base and parent commit OIDs and fold resolve_base_rev, resolve_anchors, and rev_metadata_no_snapshot into one multi-revision jj log template call, cutting spawns from 61 to 6 and wall time from ~132 ms to ~22 ms (~110 ms saved) at the cost of ~80 lines of batch-pipe plumbing in src/vcs/jj/refresh.rs."

