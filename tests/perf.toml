proposal = "--base @- runs JjVcs::with_base (28.3 ms in refresh/detect_base/500f_25c, adding revset_commit_count and get_change_id_static spawns on top of detect) and then refresh() (131.5 ms, 61 spawns), where resolve_anchors still probes trunk/fork/stack anchors despite base_override being set, followed by 50 per-file jj file show calls. Validate --base and fetch its change and commit IDs in the single startup jj log, skip trunk/fork/stack anchor probes when base_override is present, and batch the 50 file-content reads through git cat-file --batch, cutting spawns from 64 to 5 and wall time from ~160 ms to ~22 ms (~138 ms saved)."

