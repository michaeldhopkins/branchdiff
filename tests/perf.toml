[[op]]
id = "command:files"
class = "command"
fixture = "500 files, 25 changed, 5 lines each; scale of refresh/colocated/500f_25c, baselines 2026-10-18"
test = "tests/perf_rules/counts.rs::command_process_counts_match_their_floors"
processes = 62
benches = ["refresh/colocated/500f_25c", "refresh/files_head/500f_25c"]
wall_floor_us = 142041
target_us = 50000
derivation = "One diff's names and line counts, not a rendered page; one batched jj log plus the listing fits in the 50 ms command budget. Floor is refresh/colocated/500f_25c (131542 us) plus refresh/files_head/500f_25c (10499 us)."
proposal = "listing::render for --files runs a full 4-way vcs.refresh() (131.5 ms, 61 spawns including 50 per-file jj file show calls and full line diffs just to count added/deleted lines) and then spawns a 62nd jj log in current_revision_id() (10.5 ms in refresh/files_head/500f_25c). Add a dedicated Vcs::file_list path that reads changed paths, statuses, and line counts from git diff --numstat plus git status --porcelain while returning the head change ID from the initial jj log, cutting spawns from 62 to 5 and wall time from ~142 ms to ~18 ms (~124 ms saved) at the cost of a lightweight Vcs::file_list trait method."

